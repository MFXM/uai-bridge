# Publishes the multi-arch image (linux/amd64 + linux/arm64) to GitHub Container Registry.
#  - on a version tag:   git tag v1.0.1 && git push origin v1.0.1
#  - monthly:            rebuilds the LATEST release with a fresh base image (security fixes),
#                        so the published image stays patched without a new release
#  - manually:           Actions tab -> "Release image" -> "Run workflow"
name: Release image
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          fi
          if [ -z "$TAG" ]; then echo "No release tag (v*) yet - nothing to build."; exit 1; fi
          git checkout -q "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt && pytest -q
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
