# u:ai bridge - standalone deployment
# 1. Save as compose.yml next to a filled-in .env (see .env.example).
# 2. docker compose up -d
services:
  uai-bridge:
    # Option A (recommended): build from this Git checkout - uncomment the next line and run
    #   docker compose up -d --build
    # build: .
    # Option B: prebuilt multi-arch image (amd64/arm64); ":1" = newest 1.x release.
    # With "build: ." enabled, this name is only used as the tag of your local build.
    image: ghcr.io/MFXM/uai-bridge:1
    container_name: uai-bridge
    restart: unless-stopped
    env_file: .env
    ports:
      # Only reachable from this machine. Do NOT change to "8000:8000" unless
      # BRIDGE_API_KEYS is set AND you really want other machines to connect.
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
